<!-- @dsCard group="Spacing" viewport="700x180" name="iOS touch metrics" subtitle="44px minimum tap target, 56px list row, 62px primary CTA" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);padding:18px 22px}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:12px}</style></head><body><div class="col" style="max-width:420px">
<div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border:2.5px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--chip)"></div><span style="font:var(--type-small)"><b>44px</b> — HIG minimum tap target</span></div>
<div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:56px;border:2.5px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--chip)"></div><span style="font:var(--type-small)"><b>56px</b> — list row / set row</span></div>
<div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:62px;border:2.5px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--pink)"></div><span style="font:var(--type-small)"><b>62px</b> — primary CTA</span></div>
</div></body></html>
